<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quem é Quem? | Jogo Infantil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff 0%, #ffe6e6 50%, #fff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    header {
      background: linear-gradient(90deg, #dc143c 0%, #ff1744 50%, #dc143c 100%);
      padding: 30px 20px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 30px rgba(220, 20, 60, 0.3);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      animation: shimmer 8s infinite;
    }

    @keyframes shimmer {
      0% { transform: translate(0, 0); }
      50% { transform: translate(10px, -10px); }
      100% { transform: translate(0, 0); }
    }

    header h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 800;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
      letter-spacing: -1px;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header p {
      font-size: 1.1rem;
      font-weight: 500;
      position: relative;
      z-index: 1;
      animation: slideDown 0.8s ease-out;
    }

    .emoji-float {
      display: inline-block;
      margin: 0 5px;
      animation: float 3s ease-in-out infinite;
    }

    .emoji-float:nth-child(1) { animation-delay: 0s; }
    .emoji-float:nth-child(2) { animation-delay: 0.3s; }
    .emoji-float:nth-child(3) { animation-delay: 0.6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .container {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
      width: 100%;
    }

    .screen.active {
      display: block;
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-container {
      background: white;
      border-radius: 25px;
      padding: 50px 40px;
      box-shadow: 0 20px 60px rgba(220, 20, 60, 0.15);
      width: 100%;
      max-width: 900px;
      border: 2px solid #ffe6e6;
      position: relative;
    }

    .card-container::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 20px;
      background: repeating-linear-gradient(
        90deg,
        #dc143c 0px,
        #dc143c 20px,
        transparent 20px,
        transparent 40px
      );
      border-radius: 10px;
      opacity: 0.2;
    }

    .intro-screen h2 {
      font-size: 2.5rem;
      color: #dc143c;
      margin-bottom: 20px;
      font-weight: 700;
      animation: slideDown 0.6s ease-out;
    }

    .intro-screen p {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 35px;
      font-weight: 400;
      animation: slideDown 0.8s ease-out;
    }

    input[type="text"] {
      width: 100%;
      max-width: 350px;
      padding: 15px 20px;
      border: 2px solid #ffe6e6;
      border-radius: 12px;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #dc143c;
      background: white;
      box-shadow: 0 0 20px rgba(220, 20, 60, 0.2);
      transform: translateY(-2px);
    }

    input[type="text"]::placeholder {
      color: #bbb;
    }

    .btn {
      padding: 15px 45px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
      font-family: 'Poppins', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #dc143c 0%, #ff1744 100%);
      color: white;
      box-shadow: 0 8px 25px rgba(220, 20, 60, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(220, 20, 60, 0.6);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: #dc143c;
      border: 2px solid #dc143c;
      box-shadow: 0 5px 15px rgba(220, 20, 60, 0.2);
    }

    .btn-secondary:hover {
      background: #ffe6e6;
      transform: translateY(-3px);
    }

    .game-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .info-box {
      background: linear-gradient(135deg, #dc143c 0%, #ff1744 100%);
      padding: 20px 25px;
      border-radius: 15px;
      color: white;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(220, 20, 60, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .info-box label {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-right: 8px;
    }

    .info-box span {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .game-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 40px;
    }

    .game-board h3 {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 1.4rem;
      color: #dc143c;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border: 3px solid #ffe6e6;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(220, 20, 60, 0.05) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.05);
      border-color: #dc143c;
      box-shadow: 0 15px 40px rgba(220, 20, 60, 0.25);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card.selected {
      border-color: #dc143c;
      background: linear-gradient(135deg, #fff5f5 0%, #ffe6e6 100%);
      box-shadow: 0 0 20px rgba(220, 20, 60, 0.4);
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .card.matched {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      border-color: #4caf50;
      pointer-events: none;
      animation: matchedAnimation 0.6s ease;
    }

    @keyframes matchedAnimation {
      0% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: scale(1.1) rotate(5deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 0.8;
      }
    }

    .card-image {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .card-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .feedback {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 25px 0;
      min-height: 40px;
      animation: slideDown 0.4s ease-out;
    }

    .feedback.success {
      color: #4caf50;
    }

    .feedback.error {
      color: #dc143c;
    }

    .ranking-list {
      max-width: 600px;
      margin: 0 auto;
    }

    .ranking-item {
      background: linear-gradient(135deg, #fff5f5 0%, #ffe6e6 100%);
      padding: 18px 25px;
      margin: 12px 0;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      border-left: 5px solid #dc143c;
      box-shadow: 0 5px 15px rgba(220, 20, 60, 0.1);
      animation: slideUp 0.5s ease-out;
      transition: all 0.3s ease;
    }

    .ranking-item:hover {
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(220, 20, 60, 0.2);
    }

    .ranking-position {
      font-size: 1.6rem;
      color: #dc143c;
      margin-right: 20px;
      font-weight: 800;
      min-width: 45px;
    }

    .ranking-name {
      flex: 1;
      color: #333;
      font-size: 1.05rem;
    }

    .ranking-time {
      color: #dc143c;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .trophy {
      font-size: 4rem;
      text-align: center;
      margin: 20px 0;
      animation: bounce 0.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .result-message {
      font-size: 1.3rem;
      color: #333;
      margin: 20px 0;
      font-weight: 600;
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      animation: confettiFall 3s ease-out forwards;
    }

    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(0) translateX(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(500px) translateX(100px) rotate(720deg);
      }
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    @media (max-width: 768px) {
      .game-board {
        grid-template-columns: 1fr;
      }

      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-container {
        padding: 30px 20px;
      }

      header h1 {
        font-size: 2rem;
      }

      .intro-screen h2 {
        font-size: 1.8rem;
      }

      .game-info {
        grid-template-columns: 1fr;
      }

      .info-box {
        justify-content: center;
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .btn {
        padding: 12px 30px;
        font-size: 0.95rem;
      }

      .card-container {
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span class="emoji-float">🎮</span>
      Quem é Quem?
      <span class="emoji-float">🎊</span>
    </h1>
    <p>Descubra os pares entre crianças e adultos!</p>
  </header>

  <div class="container">
    <!-- Tela de Início -->
    <div id="introScreen" class="screen active">
      <div class="card-container intro-screen">
        <h2>🎉 Bem-vindo!</h2>
        <p>Prepare-se para um desafio super divertido!</p>
        <input type="text" id="playerName" placeholder="Digite seu nome..." maxlength="20" />
        <br />
        <button class="btn btn-primary" onclick="startGame()">Começar a Jogar</button>
      </div>
    </div>

    <!-- Tela de Jogo -->
    <div id="gameScreen" class="screen">
      <div class="card-container">
        <div class="game-info">
          <div class="info-box">
            <label>👤 Jogador:</label>
            <span id="playerDisplay">-</span>
          </div>
          <div class="info-box">
            <label>✅ Acertos:</label>
            <span id="matchCount">0</span><span style="font-size: 1.2rem; margin-left: 5px;">/11</span>
          </div>
          <div class="info-box">
            <label>⏱️ Tempo:</label>
            <span id="timer">90</span><span style="font-size: 1.2rem; margin-left: 5px;">s</span>
          </div>
        </div>

        <div id="feedback" class="feedback"></div>

        <div class="game-board">
          <h3>👶 Versão Criança</h3>
          <h3>🧑 Versão Adulto</h3>
          <div id="childrenGrid" class="cards-grid"></div>
          <div id="adultsGrid" class="cards-grid"></div>
        </div>

        <div style="text-align: center;">
          <button class="btn btn-secondary" onclick="endGame()">Sair do Jogo</button>
        </div>
      </div>
    </div>

    <!-- Tela de Resultado -->
    <div id="resultScreen" class="screen">
      <div class="card-container">
        <div class="trophy">🏆</div>
        <h2 style="color: #dc143c; text-align: center; font-size: 2rem; margin-bottom: 10px;">Fim do Jogo!</h2>
        <p id="resultMessage" class="result-message"></p>

        <div class="ranking-list">
          <h3 style="text-align: center; color: #dc143c; margin: 30px 0 20px;">🎯 Top Jogadores</h3>
          <div id="rankingList"></div>
        </div>

        <div class="button-group">
          <button class="btn btn-primary" onclick="backToIntro()">Jogar Novamente</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TOTAL_PAIRS = 11;
    const TIME_LIMIT = 90;

    let currentPlayer = '';
    let matchedPairs = [];
    let selectedChild = null;
    let selectedAdult = null;
    let attempts = 0;
    let timeLeft = TIME_LIMIT;
    let timerInterval = null;
    let gameActive = false;
    let rankings = JSON.parse(localStorage.getItem('rankings')) || [];

    const persons = [
      { id: 1, name: 'Pessoa 1' },
      { id: 2, name: 'Pessoa 2' },
      { id: 3, name: 'Pessoa 3' },
      { id: 4, name: 'Pessoa 4' },
      { id: 5, name: 'Pessoa 5' },
      { id: 6, name: 'Pessoa 6' },
      { id: 7, name: 'Pessoa 7' },
      { id: 8, name: 'Pessoa 8' },
      { id: 9, name: 'Pessoa 9' },
      { id: 10, name: 'Pessoa 10' },
      { id: 11, name: 'Pessoa 11' }
    ];

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) {
        alert('Digite seu nome para começar!');
        return;
      }

      currentPlayer = name;
      matchedPairs = [];
      selectedChild = null;
      selectedAdult = null;
      attempts = 0;
      timeLeft = TIME_LIMIT;
      gameActive = true;

      document.getElementById('playerDisplay').textContent = currentPlayer;
      document.getElementById('matchCount').textContent = '0';
      document.getElementById('timer').textContent = TIME_LIMIT;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      renderGame();
      showScreen('gameScreen');
      startTimer();
    }

    function renderGame() {
      const shuffledPersons = shuffle(persons);
      const childrenGrid = document.getElementById('childrenGrid');
      const adultsGrid = document.getElementById('adultsGrid');

      childrenGrid.innerHTML = '';
      adultsGrid.innerHTML = '';

      shuffledPersons.forEach(person => {
        const childCard = createCard(person, 'child');
        const adultCard = createCard(person, 'adult');

        childrenGrid.appendChild(childCard);
        adultsGrid.appendChild(adultCard);
      });
    }

    function createCard(person, type) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = person.id;
      card.dataset.type = type;

      if (matchedPairs.includes(person.id)) {
        card.classList.add('matched');
      }

      const emojis = ['👧', '👦', '👧', '👦', '👧', '👦', '👧', '👦', '👧', '👦', '👧'];
      const emoji = type === 'child' ? emojis[person.id - 1] : '🧑';

      card.innerHTML = `
        <div class="card-image">${emoji}</div>
        <div class="card-label">${type === 'child' ? 'Criança' : 'Adulto'}</div>
      `;

      if (!matchedPairs.includes(person.id)) {
        card.onclick = () => selectCard(card, person.id, type);
      }

      return card;
    }

    function selectCard(cardEl, personId, type) {
      if (!gameActive || matchedPairs.includes(personId)) return;

      if (type === 'child') {
        if (selectedChild) selectedChild.classList.remove('selected');
        selectedChild = cardEl;
        selectedChild.classList.add('selected');
      } else {
        if (selectedAdult) selectedAdult.classList.remove('selected');
        selectedAdult = cardEl;
        selectedAdult.classList.add('selected');
      }

      if (selectedChild && selectedAdult) {
        checkMatch();
      }
    }

    function checkMatch() {
      const childId = parseInt(selectedChild.dataset.id);
      const adultId = parseInt(selectedAdult.dataset.id);
      attempts++;

      if (childId === adultId) {
        matchedPairs.push(childId);
        showFeedback('✅ Acerto!', 'success');
        selectedChild.classList.add('matched');
        selectedAdult.classList.add('matched');
        selectedChild.classList.remove('selected');
        selectedAdult.classList.remove('selected');
        selectedChild = null;
        selectedAdult = null;

        document.getElementById('matchCount').textContent = matchedPairs.length;

        createConfetti();

        if (matchedPairs.length === TOTAL_PAIRS) {
          setTimeout(endGame, 500);
        }
      } else {
        showFeedback('❌ Não foi dessa vez!', 'error');
        setTimeout(() => {
          selectedChild.classList.remove('selected');
          selectedAdult.classList.remove('selected');
          selectedChild = null;
          selectedAdult = null;
        }, 500);
      }
    }

    function showFeedback(message, type) {
      const feedback = document.getElementById('feedback');
      feedback.textContent = message;
      feedback.className = `feedback ${type}`;
    }

    function createConfetti() {
      const colors = ['#dc143c', '#ff1744', '#ff69b4', '#ffd700'];
      for (let i = 0; i < 20; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.textContent = ['🎉', '🎊', '⭐', '💖', '🌟'][Math.floor(Math.random() * 5)];
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.top = '50%';
        confetti.style.fontSize = (Math.random() * 20 + 20) + 'px';
        confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;

        if (timeLeft <= 10) {
          document.getElementById('timer').parentElement.style.color = '#ff1744';
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameActive = false;
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);

      const finalTime = TIME_LIMIT - timeLeft;
      let message = '';

      if (matchedPairs.length === TOTAL_PAIRS) {
        message = `🎉 Parabéns ${currentPlayer}! Você descobriu todos os pares em ${finalTime}s!`;
        createBigConfetti();
      } else {
        message = `⏰ Tempo esgotado! Você acertou ${matchedPairs.length} de ${TOTAL_PAIRS} pares. Tente novamente!`;
      }

      document.getElementById('resultMessage').textContent = message;

      if (matchedPairs.length === TOTAL_PAIRS) {
        rankings.push({ name: currentPlayer, time: finalTime });
        rankings.sort((a, b) => a.time - b.time);
        rankings = rankings.slice(0, 10);
        localStorage.setItem('rankings', JSON.stringify(rankings));
      }

      renderRanking();
      showScreen('resultScreen');
    }

    function createBigConfetti() {
      for (let i = 0; i < 50; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.textContent = ['🎉', '🎊', '⭐', '💖', '🌟', '🎈', '🎁'][Math.floor(Math.random() * 7)];
          confetti.style.left = Math.random() * window.innerWidth + 'px';
          confetti.style.top = '-20px';
          confetti.style.fontSize = (Math.random() * 30 + 25) + 'px';
          document.body.appendChild(confetti);

          setTimeout(() => confetti.remove(), 3000);
        }, i * 50);
      }
    }

    function renderRanking() {
      const rankingList = document.getElementById('rankingList');
      rankingList.innerHTML = '';

      if (rankings.length === 0) {
        rankingList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Nenhuma pontuação registrada ainda</p>';
        return;
      }

      rankings.forEach((rank, index) => {
        const medals = ['🥇', '🥈', '🥉'];
        const medal = index < 3 ? medals[index] : (index + 1);

        const item = document.createElement('div');
        item.className = 'ranking-item';
        item.innerHTML = `
          <span class="ranking-position">${medal}</span>
          <span class="ranking-name">${rank.name}</span>
          <span class="ranking-time">${rank.time}s</span>
        `;
        rankingList.appendChild(item);
      });
    }

    function backToIntro() {
      document.getElementById('playerName').value = '';
      document.getElementById('timer').parentElement.style.color = 'white';
      showScreen('introScreen');
    }
  </script>
</body>
</html>
