<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo infantil</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7d86f, #f7b5ce, #8ad7ff);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        width: min(420px, 90vw);
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 18px;
      }

      .card {
        background: rgba(255, 255, 255, 0.26);
        border: 2px solid rgba(255, 255, 255, 0.48);
        border-radius: 24px;
        padding: 22px 18px;
        box-shadow: 0 12px 28px rgba(90, 50, 30, 0.12);
        backdrop-filter: blur(10px);
        text-align: center;
      }

      .card.highlight {
        background: rgba(255, 255, 255, 0.34);
      }

      .emoji {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 8px;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.2rem);
        line-height: 1;
        font-weight: 800;
        color: #fffefc;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      }

      .subtitle {
        margin: 10px 0 0;
        font-size: 1.06rem;
        color: #fffaf5;
        font-weight: 600;
      }

      .progress {
        width: 100%;
        height: 12px;
        background: rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 10px;
      }

      .progress-bar {
        width: 75%;
        height: 100%;
        background: linear-gradient(90deg, #f7d86f, #f9c76d, #f7b14a);
        border-radius: inherit;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="card">
        <span class="emoji">🎈</span>
        <h2 class="title">11</h2>
        <p class="subtitle">pares para descobrir</p>
      </div>

      <div class="card highlight">
        <span class="emoji">🚀</span>
        <h2 class="title">3x</h2>
        <p class="subtitle">mais divertido com desafio</p>
      </div>

      <div class="card">
        <span class="emoji">🎉</span>
        <h2 class="title">90s</h2>
        <p class="subtitle">tempo para ganhar a rodada</p>
      </div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </body>
</html>
